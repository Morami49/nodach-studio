name: guards
# Free protection layers for a private repo on GitHub's free plan (D-087, D-090).
# GitHub won't enforce rulesets here, so these make any slip visible within minutes.
on:
  push:
  schedule: [{cron: "17 3 * * 1"}]   # weekly secret re-scan
permissions: {contents: read, actions: read, issues: write, pull-requests: read}
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  workflows-parse:
    # F-24: a workflow file that doesn't parse fails silently on GitHub until its trigger fires.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -c "import glob,yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('all workflows parse')"
  no-seed-making:
    # INC-261118-seed: CI once replaced PRIVATE_SEED. No workflow may pipe a random value into a *_SEED secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check_no_seed_making.py .github/workflows
  worker-names:
    # AUD-secrets-state (1): renaming a Worker or its Durable Object class makes the record seem to vanish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check_worker_names.py hub/wrangler.toml
  main-guard:
    # Main may only move to content that already passed CI on a branch (D-087). The rules live in
    # scripts/main_guard.py (Q58 A same tree; F-main-guard-merge: the exact merge a pull_request run tested; retries
    # while GitHub catches up after a merge). Anything else opens the issue, as before.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - name: Was this content green on a branch first?
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", SHA: "${{ github.sha }}", REPO: "${{ github.repository }}"}
        run: |
          if ! python3 scripts/main_guard.py "$SHA"; then
            gh issue create -R "$REPO" --title "main moved without green CI: ${SHA:0:7}" \
              --body "Commit $SHA reached main without a passing ci run on a branch first (D-087). Check it, then revert or confirm." || true
            exit 1
          fi
