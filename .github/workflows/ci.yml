name: ci
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: engine}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: {toolchain: stable}
      - run: cargo test -p foundation-core -p exchange-core -p hub-core
  hub:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: hub}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: {toolchain: stable, targets: wasm32-unknown-unknown}
      - run: cargo check --target wasm32-unknown-unknown
  actionmap:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: actionmap}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m tests.test_core
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - run: python scripts/test_chat_index.py
      - run: python scripts/test_policy.py
      - run: python scripts/test_run_record.py
      - run: python scripts/test_change_intake.py
      - run: python scripts/test_check_no_seed_making.py
      - run: python scripts/test_money_check.py
      - run: python scripts/test_check_reliability.py
      - run: python scripts/test_risk_class.py
      - run: python scripts/test_should_automerge.py
      - run: python scripts/test_staging_train.py
      - run: python scripts/test_check_worker_names.py
      - run: python scripts/test_restore_drill.py
      - run: python scripts/test_design_tokens.py
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - run: node studio/tests/xlsx-lite.test.mjs     # M1 d: the import page's .xlsx reader
      - run: node studio/tests/standalone.test.mjs   # D-171 S1: the host shim when the hub serves Studio
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python studio/tests/scenarios.py studio/index.html
      - run: python studio/tests/import_page.py         # M1 d: import page end to end, contact tabs held back
      - run: python studio/tests/vault_page.py          # 6.1 a: settings page, versions kept, values hidden
        env: {STUDIO_TEST_OUT: studio/tests/out}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: {name: studio-scenarios, path: studio/tests/out}
  live-client:
    # B-live-session: the desktop Live client's pure logic (task lines, event shapes, points); no microphone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - run: pip install pytest && python -m pytest -q actionmap/live/test_live.py
