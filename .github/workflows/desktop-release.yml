name: desktop-release
# Nodach Desktop: pushing a tag desktop-v<version> builds nodach-desktop-<version>.zip + .zip.sha256 and attaches them
# to a GitHub Release of that tag. The Desktop window's Update button installs the newest one (checksum verified).
on:
  push:
    tags: ["desktop-v*"]
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.13"}
      - run: pip install pytest "mcp>=2.3,<3" pillow && python -m pytest -q actionmap/desktop/tests
      - name: build the zip (the tag must match actionmap/desktop/VERSION)
        run: python actionmap/desktop/build_zip.py --out dist --version "${GITHUB_REF_NAME#desktop-v}"
      - name: publish the release
        env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}"}
        run: |
          V="${TAG#desktop-v}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Nodach Desktop $V" --notes "Nodach Desktop $V. Install: unzip, double-click install-desktop.bat. Already installed: press Update in the Nodach Desktop window."
          gh release upload "$TAG" "dist/nodach-desktop-$V.zip" "dist/nodach-desktop-$V.zip.sha256" --clobber
