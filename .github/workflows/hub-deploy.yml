name: hub-deploy
# H1 (D-089): after ci passes on main, deploy the hub to Cloudflare and import Studio Web's exported events (D-095 stage A).
# Owner setup (GitHub → Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   Cloudflare token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Cloudflare dashboard (Workers & Pages → right-hand side)
#   HUB_WRITE_TOKEN        a long random string (password manager); required for /push and /import
#   HUB_READ_TOKEN         optional: a second random string for read-only nodes/surfaces
#   GH_OAUTH_CLIENT_ID / GH_OAUTH_CLIENT_SECRET  GitHub OAuth App for Claude connector sign-in (D-128)
#   GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET  Google sign-in for invited Studio users (optional)
#   RESEND_API_KEY  sends emailed sign-in links (optional; MAIL_FROM is set in hub/wrangler.toml)
# IMPORTER_SEED (the key that signs imported Studio events) is generated by CI on first deploy and
# lives only in Cloudflare: nobody sees it. Losing it just means a new importer identity.
# Until CLOUDFLARE_API_TOKEN exists this job skips.
# Executor (D-136, Q105 A step 2): Studio's SET-policy-hub-deploy decides (scripts/policy.py; GitHub variable
# POLICY_HUB_DEPLOY is the fallback): auto = deploy after green CI on main · ask = only when a person starts it
# (Actions → hub-deploy → Run workflow, optionally with a commit to roll back to) · off = never. Every run is
# recorded in Studio (RUNS-hub-deploy) with the build it replaced, so undo is one dispatch.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "commit to deploy (blank = latest main); use a recorded 'replaced' build to roll back"
        required: false
permissions: {contents: read}
jobs:
  deploy:
    # B1 d (public repo): only runs of this repository's own pushes, never a fork's pull request, may use secrets
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: hub}}
    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      HUB_URL: https://clanstack-hub.ndab-utube.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare is set up
        id: ready
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Cloudflare not set up yet (Q57): skipping."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'yes'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {ref: "${{ env.SHA }}"}
      - if: steps.ready.outputs.go == 'yes'
        name: Resolve the deploy policy (Studio first, D-139)
        id: pol
        working-directory: .
        env: {HUB_TOKEN: "${{ secrets.HUB_WRITE_TOKEN }}", PLATFORM: "${{ vars.POLICY_HUB_DEPLOY }}"}
        run: python3 scripts/policy.py SET-policy-hub-deploy --platform "$PLATFORM" --default auto
      - if: steps.ready.outputs.go == 'yes'
        name: Decide
        id: go
        working-directory: .
        env: {EFFECTIVE: "${{ steps.pol.outputs.effective }}"}
        run: |
          prev=$(curl -fsS "$HUB_URL/health" 2>/dev/null | awk '{print $2}')
          echo "prev=${prev:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$EFFECTIVE" = off ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "Deploy policy is off: nothing deployed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$EFFECTIVE" != auto ]; then echo "run=no" >> "$GITHUB_OUTPUT"; echo "Deploy policy is $EFFECTIVE: start it by hand to deploy." >> "$GITHUB_STEP_SUMMARY"
          else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.go.outputs.run == 'yes'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: {toolchain: stable, targets: wasm32-unknown-unknown}
      - if: steps.go.outputs.run == 'yes'
        name: Deploy
        id: deploy
        run: |
          export BUILD_SHA=$(echo "$SHA" | cut -c1-7)
          npx -y wrangler@4.158.0 deploy | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> $GITHUB_OUTPUT
      - if: steps.go.outputs.run == 'yes'
        name: Set hub secrets (only when provided)
        env: {HUB_WRITE_TOKEN: "${{ secrets.HUB_WRITE_TOKEN }}", HUB_READ_TOKEN: "${{ secrets.HUB_READ_TOKEN }}", GH_OAUTH_CLIENT_ID: "${{ secrets.GH_OAUTH_CLIENT_ID }}", GH_OAUTH_CLIENT_SECRET: "${{ secrets.GH_OAUTH_CLIENT_SECRET }}", GOOGLE_OAUTH_CLIENT_ID: "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}", GOOGLE_OAUTH_CLIENT_SECRET: "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}", RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}"}
        run: |
          [ -n "$HUB_WRITE_TOKEN" ] && printf '%s' "$HUB_WRITE_TOKEN" | npx -y wrangler@4.158.0 secret put --env="" HUB_WRITE_TOKEN || true
          [ -n "$HUB_READ_TOKEN" ] && printf '%s' "$HUB_READ_TOKEN" | npx -y wrangler@4.158.0 secret put --env="" HUB_READ_TOKEN || true
          # Claude connector (D-128): GitHub OAuth App for sign-in; CONNECTOR_SEED signs connector writes
          [ -n "$GH_OAUTH_CLIENT_ID" ] && printf '%s' "$GH_OAUTH_CLIENT_ID" | npx -y wrangler@4.158.0 secret put --env="" GH_OAUTH_CLIENT_ID || true
          [ -n "$GH_OAUTH_CLIENT_SECRET" ] && printf '%s' "$GH_OAUTH_CLIENT_SECRET" | npx -y wrangler@4.158.0 secret put --env="" GH_OAUTH_CLIENT_SECRET || true
          # Studio sign-in for invited people without GitHub (18 Nov): Google OAuth client, and Resend for emailed links
          for n in GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET RESEND_API_KEY; do
            v="${!n}"; [ -n "$v" ] && printf '%s' "$v" | npx -y wrangler@4.158.0 secret put --env="" "$n" || true
          done
          # 19 Nov: a flaky `secret list` once made these checks think the seeds were missing, and PRIVATE_SEED was
          # replaced (older private items sealed). Seeds are never made here now: a failed or odd list stops the deploy.
          # The list is eventually consistent right after the puts above (19 Nov run 44533863819), so ask up to 6 times.
          for i in 1 2 3 4 5 6; do
            list=$(npx -y wrangler@4.158.0 secret list --env="" 2>/dev/null) && echo "$list" | grep -q HUB_WRITE_TOKEN && break
            echo "secret list not settled yet ($i/6)"; list=""; sleep 10
          done
          [ -n "$list" ] || { echo "::error::secret list never looked right; seeds untouched"; exit 1; }
          for n in IMPORTER_SEED CONNECTOR_SEED PRIVATE_SEED; do
            echo "$list" | grep -q "\"$n\"\|$n" || { echo "::error::$n is missing on the worker. Make it once by hand (openssl rand -hex 32 | wrangler secret put $n); never in CI."; exit 1; }
          done
      - if: steps.go.outputs.run == 'yes'
        name: Step secrets for runnable flows (D-174; only when provided)
        # A flow step names a secret (e.g. REED); the hub reads NODE_SECRET_REED. Flows can't read any other secret.
        env:
          NODE_SECRET_REED: ${{ secrets.NODE_SECRET_REED }}
          NODE_SECRET_GEMINI: ${{ secrets.NODE_SECRET_GEMINI }}
          NODE_SECRET_ADZUNA_ID: ${{ secrets.NODE_SECRET_ADZUNA_ID }}
          NODE_SECRET_ADZUNA_KEY: ${{ secrets.NODE_SECRET_ADZUNA_KEY }}
        run: |
          for n in NODE_SECRET_REED NODE_SECRET_GEMINI NODE_SECRET_ADZUNA_ID NODE_SECRET_ADZUNA_KEY; do
            v="${!n}"; [ -n "$v" ] && printf '%s' "$v" | npx -y wrangler@4.158.0 secret put --env="" "$n" || true
          done
      - if: steps.go.outputs.run == 'yes'
        name: Check health and import Studio Web's export
        env: {URL: "${{ steps.deploy.outputs.url }}", HUB_WRITE_TOKEN: "${{ secrets.HUB_WRITE_TOKEN }}"}
        run: |
          # F-28: a first deploy's workers.dev address can take a minute to go live; wait up to ~3 min.
          for i in $(seq 1 18); do curl -fsS "$URL/health" && break; echo "not live yet ($i/18)"; sleep 10; done; echo
          curl -fsS "$URL/health"; echo
          if [ -f ../exports/studio-events.json ] && [ -n "$HUB_WRITE_TOKEN" ]; then
            curl -fsS -X POST -H "authorization: Bearer $HUB_WRITE_TOKEN" "$URL/import" --data-binary @../exports/studio-events.json; echo
          fi
          [ -n "$HUB_WRITE_TOKEN" ] && curl -fsS -H "authorization: Bearer $HUB_WRITE_TOKEN" "$URL/status"; echo
      - if: steps.go.outputs.run == 'yes'
        name: Smoke-test the Claude connector (F-46)
        env: {URL: "${{ steps.deploy.outputs.url }}", HUB_WRITE_TOKEN: "${{ secrets.HUB_WRITE_TOKEN }}"}
        run: |
          set -e
          # unauthenticated: must start sign-in
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/mcp" -d '{}'); test "$code" = 401
          curl -fsS "$URL/.well-known/oauth-protected-resource" | grep -q '"resource"'
          curl -fsS "$URL/.well-known/oauth-authorization-server" | grep -q '"S256"'
          [ -z "$HUB_WRITE_TOKEN" ] && exit 0
          rpc() { curl -fsS -X POST "$URL/mcp" -H "authorization: Bearer $HUB_WRITE_TOKEN" -H 'content-type: application/json' -d "$1"; }
          # twice in a row on purpose: the second call is what crashed before F-46 was fixed
          for i in 1 2; do
            rpc '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | grep -q '"protocolVersion"'
            rpc '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | grep -q '"import_studio_events"'
            rpc '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"hub_status","arguments":{}}}' | grep -q '"verified":true'
            rpc '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"read_events","arguments":{"after":0,"limit":5}}}' | grep -q '"next"'
          done
          rpc '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"hub_log","arguments":{"limit":3}}}' | grep -q '"tool":"hub_log"'
          curl -fsS "$URL/health" | grep -q "ok $(echo "$SHA" | cut -c1-7)"
          echo "connector smoke test passed"
      - name: Record the run in Studio (P-13)
        if: always() && steps.go.outputs.run == 'yes'
        working-directory: .
        env:
          HUB_TOKEN: ${{ secrets.HUB_WRITE_TOKEN }}
          STATUS: ${{ job.status }}
          POLICY: ${{ steps.pol.outputs.effective }}
          PREV: ${{ steps.go.outputs.prev }}
        run: |
          now=$(curl -fsS "$HUB_URL/health" 2>/dev/null | awk '{print $2}')
          short=$(echo "$SHA" | cut -c1-7)
          if [ "$STATUS" = success ]; then text="Deployed $short (replaced $PREV); health ok, connector smoke test passed."; outcome=success
          else text="Deploy of $short $STATUS; the hub now answers ${now:-nothing} (was $PREV)."; outcome=failure; fi
          RUN_SHA="$SHA" python3 scripts/run_record.py hub-deploy --title "Hub deploys" --outcome "$outcome" --text "$text" \
            --policy "$POLICY" --undo "Roll back: Actions → hub-deploy → Run workflow with sha = $PREV" \
            --field "build=$short" --field "replaced=$PREV" --field "live=${now:-unknown}"
